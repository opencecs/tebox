syntax = "proto3";

package tebox.v1;

option go_package = "tebox-client/api/v1;teboxv1";

service AndroidService {
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  rpc GetInstance(InstanceRequest) returns (Instance);
  rpc CreateInstance(CreateInstanceRequest) returns (Instance);
  // Change a stopped instance's config (resources, boot overrides, profile).
  // Applied on the next StartInstance.
  rpc UpdateInstance(UpdateInstanceRequest) returns (Instance);
  rpc DeleteInstance(InstanceRequest) returns (Empty);
  rpc StartInstance(InstanceRequest) returns (Empty);
  rpc StopInstance(InstanceRequest) returns (Empty);
  rpc ResetInstance(ResetInstanceRequest) returns (Empty);
  rpc ConfigureInstance(ConfigureInstanceRequest) returns (Empty);
  rpc SendKey(KeyRequest) returns (Empty);
  rpc PowerDown(InstanceRequest) returns (Empty);
  // Still frame of the guest display. Navigation keys, Android keycodes,
  // text and clipboard stay on the TCP/UDP control port, not gRPC.
  rpc GetPreview(GetPreviewRequest) returns (GetPreviewResponse);
  // Tail of the instance's serial console capture (per-instance console.log).
  rpc GetConsoleLog(ConsoleLogRequest) returns (ConsoleLogResponse);
  // Follow the serial console from near its tail until the client disconnects.
  rpc StreamConsoleLog(ConsoleLogRequest) returns (stream ConsoleLogChunk);
}

message Empty {}
message ListInstancesRequest {}
// Zero fields take the defaults: 4 cores, 4096 MB memory, 8192 MB disk.
// Empty image paths take the variant's images under src/aosp/<variant>/images.
message CreateInstanceRequest {
  string name = 1;
  int32 cpu_cores = 2;   // 1..host cores
  int32 memory_mb = 3;   // 1024..65536
  int32 disk_mb = 4;     // userdata size, 1024..1048576
  // Absolute paths on the API host. QEMU opens system and vendor read-only,
  // so instances can share them.
  string system_image = 5;     // ext4 system.img
  string vendor_image = 6;     // ext4 vendor.img
  string initramfs_image = 7;  // gzip cpio initramfs.img
  // Instance directory on the API host: userdata.img, QMP/cast
  // sockets. Absolute, absent or empty, at most 88 bytes (Unix socket
  // paths); removed by DeleteInstance. Empty: <data root>/instances/<id>.
  string instance_dir = 8;
  // Boot overrides. Empty falls back to the variant's files
  // (src/aosp/<variant>/qemu/cmdline/boot, GPU, KERNEL), so the image need
  // not bake those files in.
  repeated string cmdline = 9;  // kernel cmdline tokens (one per element)
  string gpu = 10;              // gfxstream | virgl | mali
  string kernel = 11;           // absolute path to a kernel Image; empty = built-in
  // Extra cmdline tokens appended on top of cmdline (or the variant default
  // when cmdline is empty), not replacing it. For custom-kernel tweaks.
  repeated string append = 12;
}

message InstanceRequest {
  string id = 1;
}

message ResetInstanceRequest {
  string id = 1;
  bool wipe_data = 2;
}

message ConfigureInstanceRequest { string id = 1; DeviceProfile profile = 2; }
message KeyRequest { string id = 1; string key = 2; }

// A repeated-string value wrapped so absence (null) differs from an empty
// list: unset leaves the field unchanged, set (even empty) replaces it.
message StringList { repeated string values = 1; }

// Only the set fields change; the rest keep their current value. Applied on
// the next StartInstance.
message UpdateInstanceRequest {
  string id = 1;
  optional string name = 2;
  optional int32 cpu_cores = 3;
  optional int32 memory_mb = 4;
  optional string system_image = 5;     // empty string resets to variant default
  optional string vendor_image = 6;
  optional string initramfs_image = 7;
  StringList cmdline = 8;
  optional string gpu = 9;
  optional string kernel = 10;
  StringList append = 11;
  DeviceProfile profile = 12;
}

message ConsoleLogRequest {
  string id = 1;
  int32 max_bytes = 2;  // tail size; 0 = default (64 KiB), capped at 4 MiB
}
message ConsoleLogResponse { bytes data = 1; }
message ConsoleLogChunk { bytes data = 1; }

message ListInstancesResponse {
  repeated Instance instances = 1;
}

message Instance {
  reserved 3;                // was `variant`
  reserved "variant";
  string id = 1;
  string name = 2;
  string dir = 4;  // instance directory (userdata, sockets)
  int32 adb_port = 5;
  int32 pid = 6;
  bool running = 7;
  DeviceProfile profile = 8;
  int32 cast_port = 9;
  // Input port while running, TCP and UDP on the same number: JSON lines such
  // as {"type":"touch","action":"down","x":0.5,"y":0.25} (see README).
  int32 control_port = 10;
  int32 cpu_cores = 11;
  int32 memory_mb = 12;
  int32 disk_mb = 13;       // userdata size (allocated)
  int32 disk_used_mb = 14;  // host space userdata.img occupies
  InstanceState state = 15;
  // Images the instance boots (the variant's unless set at creation).
  string system_image = 16;
  string vendor_image = 17;
  string initramfs_image = 18;
  int32 disk_free_mb = 19;  // max(0, disk_mb - disk_used_mb)
  // Boot overrides set at creation; empty cmdline means the API's fixed
  // default, empty gpu / kernel the variant's files.
  repeated string cmdline = 20;
  string gpu = 21;
  string kernel = 22;
  repeated string append = 23;
}

enum InstanceState {
  INSTANCE_STATE_UNSPECIFIED = 0;
  INSTANCE_STATE_STOPPED = 1;
  INSTANCE_STATE_STARTING = 2;  // QEMU running, Android still booting
  INSTANCE_STATE_RUNNING = 3;   // sys.boot_completed=1
  INSTANCE_STATE_STOPPING = 4;
}

message GetPreviewRequest {
  string id = 1;
  // Longest side in pixels after scaling (up or down). 0 keeps native size.
  // Capped at 4096.
  int32 size = 2;
  // jpeg (default) or png.
  string format = 3;
  // 1..100, jpeg only; default 80. Ignored for png.
  int32 quality = 4;
}

message GetPreviewResponse {
  bytes image = 1;
  string format = 2;
  string mime_type = 3;
  int32 width = 4;
  int32 height = 5;
}

message DeviceProfile {
  double latitude = 1;
  double longitude = 2;
  string country = 3;
  string operator_numeric = 4;
  string operator_name = 5;
  string cell_id = 6;
  string phone_number = 7;
  bool root = 8;
}
